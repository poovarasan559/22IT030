name: docker-pipeline-poovarasan
on: push
jobs:
   docker-job:
     runs-on: ubuntu-latest
     steps:
       - name: Print your Register number
         run: echo "Hello-World - 22IT030" 

       - name: Checkout
         uses: actions/checkout@v4

       - name: Docker Build
         run: docker build -t poovarasan15/ml-model-22it030 .

       - name: Docker Images
         run: docker images

       - name: Login to Docker Hub
         uses: docker/login-action@v3
         with:
           username: ${{ vars.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

       - name: Docker push
         run: docker push poovarasan15/ml-model-22it030
